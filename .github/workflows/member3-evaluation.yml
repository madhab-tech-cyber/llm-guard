name: Member 3 Evaluation Metrics

on:
  pull_request:
    branches: [main]
    paths:
      - "scanners/output_guard/**"
      - ".github/workflows/member3-evaluation.yml"
  push:
    branches: [member3-evaluation-metrics]
    paths:
      - "scanners/output_guard/**"
      - ".github/workflows/member3-evaluation.yml"

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile output guard
        run: python -m compileall -q scanners/output_guard
      - name: Run output guard unit tests
        run: python -m unittest scanners.output_guard.test_output_guard -v
      - name: Run pipeline adapter tests
        run: python -m unittest scanners.output_guard.test_pipeline_contract -v
      - name: Test evaluation report
        run: python -m unittest scanners.output_guard.test_evaluate -v
      - name: Generate synthetic evaluation report
        run: python -m scanners.output_guard.evaluate
